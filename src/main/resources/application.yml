spring:
  profiles:
    active: dev
  application:
    name: lingotlow-backend-core

  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 30000
    max-connections: 200
    threads:
      max: 200
      min-spare: 10

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    com.lingotlow: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %level - [%thread] - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} - %level - [%thread] - %logger{36} - %msg%n"
  file:
    name: logs/lingotlow-backend.log
    max-size: 10MB
    max-history: 30

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: true
  packages-to-scan: com.lingotlow.interfaces.controller

# Custom Application Properties
app:
  security:
    jwt:
      secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnly}
      expiration: 86400000 # 24 hours in milliseconds
    api-key:
      prefix: lingotlow_
      hash-algorithm: BCrypt
  storage:
    s3:
      bucket: ${S3_BUCKET:lingotlow-payloads}
      region: ${S3_REGION:us-east-1}
      max-inline-payload-bytes: 10240 # 10KB
  queue:
    redis:
      streams:
        events: stream:events
        retry: stream:retry
        dlq: stream:dlq
    retry:
      max-attempts: 3
      backoff:
        initial-delay: 1000 # 1 second
        max-delay: 60000 # 60 seconds
        multiplier: 2.0
  rate-limit:
    default:
      requests-per-second: 100
  idempotency:
    ttl-seconds: 3600 # 1 hour