spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lingotlow_dev
    username: lingotlow
    password: lingotlow_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      pool-name: LingotlowHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: false  # Desabilitar Flyway por enquanto
    baseline-on-migrate: true

  # Redis desabilitado temporariamente
  # redis:
  #   host: localhost
  #   port: 6379
  #   timeout: 2000ms
  #   lettuce:
  #     pool:
  #       max-active: 8
  #       max-idle: 8
  #       min-idle: 0

# Logging for Development
logging:
  level:
    com.lingotlow: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG

# Server Configuration for Development
server:
  port: 8080

# Security Configuration for Development (desabilitado temporariamente)
app:
  security:
    jwt:
      secret: developmentSecretKeyForLocalTestingOnly
      expiration: 86400000
    admin:
      default-email: admin@lingotlow.com
      default-password: admin123

  # Storage Configuration for Development (desabilitado)
  storage:
    s3:
      enabled: false

  # Queue Configuration for Development (desabilitado)
  queue:
    redis:
      enabled: false

  # Rate Limit Configuration for Development
  rate-limit:
    enabled: false

  # Feature Flags for Development
  features:
    circuit-breaker: false
    s3-storage: false
    stripe-billing: false
    idempotency: true