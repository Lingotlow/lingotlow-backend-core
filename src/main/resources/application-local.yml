spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lingotlow_dev
    username: lingotlow
    password: lingotlow_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      pool-name: LingotlowHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  web:
    resources:
      add-mappings: false

logging:
  level:
    com.lingotlow: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: developmentSecretKeyForLocalTestingOnlyWithAtLeast512Bits1234567890123456789012345678901234567890
      expiration: 86400000