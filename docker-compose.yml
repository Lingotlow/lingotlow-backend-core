services:
  postgres:
    image: postgres:16
    container_name: lingotlow_postgres
    environment:
      POSTGRES_USER: lingotlow
      POSTGRES_PASSWORD: lingotlow_dev
      POSTGRES_DB: lingotlow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: lingotlow_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: lingotlow_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped

volumes:
  postgres_data: